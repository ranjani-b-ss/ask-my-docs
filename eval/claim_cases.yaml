# Week 6 eval set — 27 claim files, each tagged with one Week-5 taxonomy mode.
#
# Every case is an adjuster's claim file. The app retrieves the policy clauses that bear on
# it and writes an eight-line summary; the eval scores that summary with four deterministic
# assertions plus one judged criterion.
#
# The `mode` tag is the Week-5 failure this case is built to expose, so the pass rate can be
# reported per mode. An overall average would let a regression on one mode hide behind
# another mode carrying the number, which is the whole reason the taxonomy exists.
#
#   refuses-answer-present    mode 1 — refuses although the answering clause was retrieved
#   drops-limiting-condition  mode 2 — right figure, the condition that limits it dropped
#   wrong-document-retrieved  mode 3 — the clause exists and never reaches the list
#   placeholder-banner-cited  mode 4 — the corpus's own front matter served as a source
#   pdf-table-mangled         mode 5 — a PDF table arrives as one-line pseudo-headings
#   clean-baseline            the "no failure observed" row — controls, so a change that
#                             breaks working behaviour shows up as a fall here
#
# NOTE ON GOLD ANSWERS: there are deliberately none in this file. The judged criterion is
# validated against hand labels written from the produced summaries (labels_25.json), and an
# expected verdict sitting here would be a hint to the labeller. The assertions need no gold
# because they are predicates over the text.
#
# `regression_of` marks a case replayed from a real failed trace in traces/traces.jsonl. The
# `verbatim` field is the exact query string that failed, copied from the trace, and it is
# reproduced unchanged as the Coverage question line.

cases:

  # ============================ mode 1 — refuses-answer-present ============================

  - id: m1-permanent-exclusions
    mode: refuses-answer-present
    corpus: uploaded
    regression_of: tr_eeff25a3bea3
