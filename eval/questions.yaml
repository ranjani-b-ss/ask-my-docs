# Gold question set for the insurance placeholder corpus.
#
# Three kinds, because they measure different failures:
#
#   answerable   — the fact sits in exactly one place. Tests plain retrieval.
#   superseded   — an endorsement overrides the base wording. The system must surface the
#                  CURRENT figure and outrank the stale one. This is the hard case, and the
#                  one a keyword search gets confidently wrong.
#   unanswerable — the fact is absent. The system must abstain. `near_miss: true` marks the
#                  cruel variety: topically adjacent, so the cosine gate lets it through and
#                  only the cross-encoder catches it.
#
# `expect_text` values must appear VERBATIM in the correct chunk — the harness does a
# substring match, so keep them short and exact.

- id: ncb-three-years
  question: What No Claim Bonus applies after three consecutive claim-free years?
  kind: answerable
  expect_doc: PW-MOTOR-001
  expect_text: ["35%"]

- id: file-retention
  question: How long does the insurer keep claim files after settlement?
  kind: answerable
  expect_doc: PW-CLAIMS-003
  expect_text: ["eight years"]

- id: grace-period
  question: If I miss the premium due date, how long do I have to pay?
  kind: answerable
  expect_doc: PW-DEFS-004
  expect_text: ["30 days"]

- id: portability-window
  question: How far before renewal must I apply to move to another insurer?
  kind: answerable
  expect_doc: PW-DEFS-004
  expect_text: ["45 days"]

- id: tyre-limit
  question: If my tyres are damaged in an accident, how much is payable?
  kind: answerable
  expect_doc: PW-MOTOR-001
  expect_text: ["50% of the cost of replacement"]

- id: day-care-opd
