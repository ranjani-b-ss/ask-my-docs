# A week of traffic for the claims assistant.
#
# IMPORTANT — how this file was written, because it decides whether the Week 5 frequencies
# mean anything:
#
# These questions were written from the CLAIMS DOMAIN, not from the documents. Nobody
# checked whether the corpus can answer them before adding them, and there are no gold
# answers here. That is deliberate. A bank written by reading the corpus first would only
# contain answerable questions, every abstention would look like a bug, and the resulting
# frequencies would describe the bank rather than the app.
#
# So the mix below is what a real claims desk sends at an assistant:
#   - straight coverage and limit questions
#   - process and deadline questions
#   - questions about the wrong line of business (a motor question aimed at health)
#   - questions the documents simply do not cover
#   - vague one-word queries, typos, lowercase, abbreviations
#   - multi-part questions
#   - a few carrying claimant identifiers, which exercises redaction on live traffic
#   - a small amount of off-topic noise, which every real log contains
#
# No question here is known-broken and none was chosen because it fails. `set: random`
# marks this as the population the seeded sample is drawn from; the curated showcase
# questions live in eval/demo_set.yaml and are excluded from that population.

set: random

questions:
  # ---- motor, coverage and amounts ------------------------------------------------
  - {corpus: insurance, q: "What is the compulsory deductible for a private car above 1500cc?"}
  - {corpus: insurance, q: "Is depreciation deducted on plastic parts in an own damage claim?"}
  - {corpus: insurance, q: "My client's car is 3 years old. What depreciation rate applies to the rubber parts?"}
  - {corpus: insurance, q: "Does the policy cover damage to tyres alone?"}
  - {corpus: insurance, q: "Is engine damage from driving through a flooded road covered?"}
  - {corpus: insurance, q: "What happens to the claim if the driver had no valid licence?"}
  - {corpus: insurance, q: "Can I claim for a stolen stereo that was not factory fitted?"}
  - {corpus: insurance, q: "Is the nil depreciation cover applicable to a claim in June 2026?"}
  - {corpus: insurance, q: "how much is the deductible now"}
  - {corpus: insurance, q: "What is the towing charge limit after an accident?"}
  - {corpus: insurance, q: "Is there a limit on the number of own damage claims in a year?"}
  - {corpus: insurance, q: "Does the own damage section pay for consequential loss?"}
  - {corpus: insurance, q: "What is the depreciation on a fibreglass component?"}
  - {corpus: insurance, q: "If the car is a total loss how is the settlement amount calculated?"}
  - {corpus: insurance, q: "Is a windscreen-only claim treated as a full claim for NCB purposes?"}

